[workspace]
members  = ["crates/lemma"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2024"
authors     = ["Replico Labs"]
license     = "MIT"
repository  = "https://github.com/replicolabs/lemma"
homepage    = "https://asklemma.xyz"
description = "Automated smart contract security analysis for Solana programs"

[workspace.dependencies]
anyhow  = "1"
thiserror = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive", "env", "color"] }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
hex  = "0.4"
indicatif = "0.17"
owo-colors = "4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
overflow-checks = true  